<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Selecionar Área</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      cursor: crosshair;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #E4E4E7;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 8px;
      pointer-events: none;
    }
    #cancelTopBtn {
      position: fixed;
      top: 14px;
      right: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #E4E4E7;
      border: 1px solid #2E2E32;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }
    #rect {
      position: absolute;
      display: none;
      border: 1.5px solid #30D158;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.55);
      background: transparent;
    }
    .handle {
      position: absolute;
      width: 10px;
      height: 10px;
      margin: -5px;
      background: #30D158;
      border: 1.5px solid #0E0E10;
      border-radius: 50%;
    }
    .handle[data-pos="nw"] { left: 0; top: 0; cursor: nwse-resize; }
    .handle[data-pos="n"]  { left: 50%; top: 0; cursor: ns-resize; }
    .handle[data-pos="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
    .handle[data-pos="e"]  { left: 100%; top: 50%; cursor: ew-resize; }
    .handle[data-pos="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
    .handle[data-pos="s"]  { left: 50%; top: 100%; cursor: ns-resize; }
    .handle[data-pos="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
    .handle[data-pos="w"]  { left: 0; top: 50%; cursor: ew-resize; }
    #dimLabel {
      position: absolute;
      display: none;
      top: -26px;
      left: 0;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }
    #actions {
      position: absolute;
      display: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      gap: 10px;
      white-space: nowrap;
    }
    #actions.visible { display: flex; }
    #startBtn, #cancelBtn {
      font-size: 12.5px;
      font-weight: 600;
      width: 92px;
      height: 92px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      border: 1px solid #2E2E32;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.6);
      transition: transform 0.1s, border-color 0.15s;
    }
    #startBtn:hover, #cancelBtn:hover { transform: translateY(-1px); }
    #startBtn svg, #cancelBtn svg { width: 26px; height: 26px; }

    #startBtn {
      background: #232326;
      color: #F4F4F5;
    }
    #startBtn:hover { border-color: rgba(255, 59, 48, 0.5); }
    #startBtn .rec-icon { color: #FF3B30; }

    #cancelBtn {
      background: #1A1A1D;
      color: #8A8A93;
    }
    #cancelBtn:hover { border-color: #3A3A40; color: #C8C8CE; }
  </style>
</head>
<body>
  <div id="hint">Arraste para selecionar a área. Esc para cancelar.</div>
  <button id="cancelTopBtn">Cancelar (Esc)</button>
  <div id="rect">
    <div id="dimLabel"></div>
    <div class="handle" data-pos="nw"></div>
    <div class="handle" data-pos="n"></div>
    <div class="handle" data-pos="ne"></div>
    <div class="handle" data-pos="e"></div>
    <div class="handle" data-pos="se"></div>
    <div class="handle" data-pos="s"></div>
    <div class="handle" data-pos="sw"></div>
    <div class="handle" data-pos="w"></div>
    <div id="actions">
      <button id="startBtn">
        <svg class="rec-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>
        Iniciar
      </button>
      <button id="cancelBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        Cancelar
      </button>
    </div>
  </div>
  <script src="areaselect.js"></script>
</body>
</html>
