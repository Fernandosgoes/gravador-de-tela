<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gravador de Tela</title>
  <link rel="stylesheet" href="toolbar.css">
</head>
<body class="state-idle">
  <div class="card" id="card">
    <div class="expanded-view">
      <div class="card-header" id="dragbar">
        <span class="title">Gravador de Tela</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="btnSettings" title="Configurar atalhos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="icon-btn" id="btnClose" title="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
          <button class="icon-btn" id="btnCloseSettings" title="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <span class="title">Configurações</span>
        </div>

        <div class="settings-tabs">
          <button class="settings-tab active" data-tab="shortcuts">Atalhos</button>
          <button class="settings-tab" data-tab="interface">Interface</button>
          <button class="settings-tab" data-tab="about">Sobre</button>
        </div>

        <div class="settings-body settings-tab-panel active" data-tab-panel="shortcuts">
          <div class="field shortcut-field" data-action="toggleRecord">
            <label>Iniciar/Parar gravação</label>
            <div class="shortcut-row">
              <input type="text" class="shortcutInput" readonly placeholder="Sem atalho — clique para definir">
              <button class="icon-btn shortcutClear" title="Remover atalho">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <div class="field shortcut-field" data-action="pause">
            <label>Pausar / Retomar</label>
            <div class="shortcut-row">
              <input type="text" class="shortcutInput" readonly placeholder="Sem atalho — clique para definir">
              <button class="icon-btn shortcutClear" title="Remover atalho">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <div class="field shortcut-field" data-action="cancel">
            <label>Cancelar gravação</label>
            <div class="shortcut-row">
              <input type="text" class="shortcutInput" readonly placeholder="Sem atalho — clique para definir">
              <button class="icon-btn shortcutClear" title="Remover atalho">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <div class="field shortcut-field" data-action="pen">
            <label>Caneta</label>
            <div class="shortcut-row">
              <input type="text" class="shortcutInput" readonly placeholder="Sem atalho — clique para definir">
              <button class="icon-btn shortcutClear" title="Remover atalho">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <div class="field shortcut-field" data-action="arrow">
            <label>Seta</label>
            <div class="shortcut-row">
              <input type="text" class="shortcutInput" readonly placeholder="Sem atalho — clique para definir">
              <button class="icon-btn shortcutClear" title="Remover atalho">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <div class="field shortcut-field" data-action="rect">
            <label>Retângulo</label>
            <div class="shortcut-row">
              <input type="text" class="shortcutInput" readonly placeholder="Sem atalho — clique para definir">
              <button class="icon-btn shortcutClear" title="Remover atalho">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="settings-body settings-tab-panel" data-tab-panel="interface">
          <div class="field">
            <label>Formato de exportação</label>
            <div class="format-options">
              <label class="format-option">
                <input type="radio" name="outputFormat" value="mp4" checked>
                MP4 (recomendado)
              </label>
              <label class="format-option">
                <input type="radio" name="outputFormat" value="webm">
                WebM
              </label>
            </div>
          </div>
          <div class="field">
            <label>Cor do contorno</label>
            <div class="color-swatches" id="frameColorSwatches">
              <button class="color-swatch active" data-color="#30D158" title="Verde" style="background:#30D158"></button>
              <button class="color-swatch" data-color="#FFCC00" title="Amarelo" style="background:#FFCC00"></button>
              <button class="color-swatch" data-color="#0A84FF" title="Azul" style="background:#0A84FF"></button>
              <button class="color-swatch" data-color="#FF3B30" title="Vermelho" style="background:#FF3B30"></button>
            </div>
          </div>
        </div>

        <div class="settings-body settings-tab-panel about-panel" data-tab-panel="about">
          <div class="about-app">Gravador de Tela</div>
          <div class="about-author">Feito por Fernando Sabino Goes</div>
          <p class="about-message">
            Esse app foi feito para que você não precise mais se preocupar com seus dados em outras plataformas.
            Baixe e use — sem assinatura, sem mensalidade, 100% gratuito.
          </p>
        </div>
      </div>

      <div class="card-body">
        <div class="mode-row">
          <button class="mode-block active" id="modeFullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
            <span class="label">Tela Inteira</span>
          </button>
          <button class="mode-block" id="modeArea">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
            <span class="label">Área Customizada</span>
          </button>
        </div>

        <div class="field">
          <label for="cameraSelect">Câmera</label>
          <select id="cameraSelect"></select>
        </div>

        <div class="field">
          <label for="micSelect">Microfone</label>
          <select id="micSelect"></select>
          <div class="toggle-row">
            <span class="label">Áudio do sistema</span>
            <label class="switch">
              <input type="checkbox" id="sysAudioToggle">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>

        <div class="record-row">
          <button class="record-btn" id="btnRecord" title="Gravar">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>
          </button>
          <span class="rec-label">Gravar</span>
        </div>

        <div class="preview-actions" id="previewActions">
          <button class="btn-save" id="btnSave">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            Salvar
          </button>
          <button class="btn-discard" id="btnDiscard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            Descartar
          </button>
        </div>

      </div>
    </div>

    <div class="compact-view" id="compactDragZone">
      <div class="compact-row1">
        <div class="rec-dot"></div>
        <span class="timer" id="pillTimer">00:00</span>

        <div class="pill-divider"></div>

        <div class="compact-tools">
          <button class="icon-btn" id="btnPenC" title="Caneta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
          </button>
          <button class="icon-btn" id="btnArrowC" title="Seta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
          </button>
          <button class="icon-btn" id="btnRectC" title="Retângulo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
          </button>
        </div>

        <span class="spacer"></span>

        <div class="pill-controls">
          <button class="icon-btn" id="btnPause" title="Pausar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <button class="icon-btn stop-outline" id="btnStop" title="Parar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
          <button class="icon-btn danger" id="btnCancel" title="Cancelar gravação (descarta)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="compact-row2" id="colorSwatches">
        <span class="swatch-label">Cor</span>
        <div class="color-swatches">
          <button class="color-swatch" data-color="#000000" title="Preto" style="background:#000000"></button>
          <button class="color-swatch" data-color="#FFFFFF" title="Branco" style="background:#FFFFFF"></button>
          <button class="color-swatch" data-color="#FF3B30" title="Vermelho" style="background:#FF3B30"></button>
          <button class="color-swatch active" data-color="#FFCC00" title="Amarelo" style="background:#FFCC00"></button>
          <button class="color-swatch" data-color="#0A84FF" title="Azul" style="background:#0A84FF"></button>
        </div>
        <span class="spacer"></span>
        <button class="icon-btn" id="btnToolOff" title="Desligar ferramenta (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <canvas id="compositeCanvas" style="display:none"></canvas>
  <video id="screenVideo" style="display:none" autoplay muted></video>

  <script src="../../renderer/recorder.js"></script>
  <script src="toolbar.js"></script>
</body>
</html>
